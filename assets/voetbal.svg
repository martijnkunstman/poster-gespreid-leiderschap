<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 92">
    <style>
        text { font-family: "Google Sans", Arial, sans-serif; text-anchor: middle; }
        .lijn { fill: none; stroke: #8c99a8; stroke-width: 0.6; }
        .speler { fill: #e4dcd2; }
        .nr { font-size: 3.2px; font-weight: 800; fill: #34404d; }
        .pass { fill: none; stroke: #f4f0ec; stroke-width: 0.5; stroke-dasharray: 1.2 0.8; }
        .loop { fill: none; stroke: #f4f0ec; stroke-width: 0.6; }
        .notitie { font-size: 3.2px; font-weight: 400; font-style: italic; fill: #f4f0ec; }
        .coach-kop { font-size: 3.6px; font-weight: 800; letter-spacing: 0.2px; fill: #34404d; }
        .coach-sub { font-size: 3px; font-weight: 400; font-style: italic; fill: #34404d; }
    </style>
    <defs>
        <marker id="pijl" viewBox="0 0 4 4" refX="3" refY="2" markerWidth="4" markerHeight="4" orient="auto">
            <path d="M0,0 L4,2 L0,4 z" fill="#f4f0ec" />
        </marker>
    </defs>

    <!-- veld -->
    <rect x="2" y="2" width="116" height="70" rx="2" fill="#34404d" stroke="#8c99a8" stroke-width="0.6" />
    <line x1="60" y1="2" x2="60" y2="72" class="lijn" />
    <circle cx="60" cy="37" r="9" class="lijn" />
    <rect x="2" y="20" width="14" height="34" class="lijn" />
    <rect x="104" y="20" width="14" height="34" class="lijn" />

    <!-- looplijnen: back stoomt op, nr. 6 neemt zijn plek over -->
    <path d="M22,15 Q30,8 41,9" class="loop" marker-end="url(#pijl)" />
    <path d="M48,34 Q38,30 28,22" class="loop" stroke-dasharray="1.2 0.8" marker-end="url(#pijl)" />

    <!-- passdriehoek -->
    <polygon points="46,10 62,28 86,18" class="pass" />

    <!-- spelers (4-3-3) -->
    <circle cx="8" cy="37" r="3.4" class="speler" /><text x="8" y="38.2" class="nr">1</text>
    <circle cx="22" cy="15" r="3.4" fill="none" stroke="#8c99a8" stroke-width="0.5" stroke-dasharray="0.8 0.6" />
    <circle cx="22" cy="31" r="3.4" class="speler" /><text x="22" y="32.2" class="nr">4</text>
    <circle cx="22" cy="46" r="3.4" class="speler" /><text x="22" y="47.2" class="nr">3</text>
    <circle cx="22" cy="61" r="3.4" class="speler" /><text x="22" y="62.2" class="nr">5</text>
    <circle cx="27" cy="21" r="3.4" class="speler" /><text x="27" y="22.2" class="nr">6</text>
    <circle cx="62" cy="28" r="3.4" class="speler" /><text x="62" y="29.2" class="nr">8</text>
    <circle cx="52" cy="50" r="3.4" class="speler" /><text x="52" y="51.2" class="nr">10</text>
    <circle cx="86" cy="18" r="3.4" class="speler" /><text x="86" y="19.2" class="nr">7</text>
    <circle cx="94" cy="37" r="3.4" class="speler" /><text x="94" y="38.2" class="nr">9</text>
    <circle cx="86" cy="56" r="3.4" class="speler" /><text x="86" y="57.2" class="nr">11</text>

    <!-- balbezitter: tijdelijk leider -->
    <circle cx="46" cy="10" r="4.2" fill="#ffffff" stroke="#e4dcd2" stroke-width="0.8" />
    <text x="46" y="11.2" class="nr">2</text>
    <circle cx="50.5" cy="13.5" r="1.2" fill="#ffffff" stroke="#34404d" stroke-width="0.3" />

    <!-- notities -->
    <text x="51.5" y="7" class="notitie" style="text-anchor: start;">neemt initiatief</text>
    <text x="42" y="39" class="notitie">neemt plek over</text>
    <text x="96" y="27" class="notitie">samenspel</text>

    <!-- coach langs de lijn -->
    <rect x="26" y="76" width="68" height="14" rx="1.5" fill="#e4dcd2" />
    <text x="60" y="82" class="coach-kop">COACH LANGS DE LIJN</text>
    <text x="60" y="87" class="coach-sub">trapt zelf geen bal, schept ruimte en veiligheid</text>
</svg>
