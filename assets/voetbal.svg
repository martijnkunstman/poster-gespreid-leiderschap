<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 92">
    <style>
        text { font-family: "Google Sans", Arial, sans-serif; text-anchor: middle; }
        .lijn { fill: none; stroke: #8c99a8; stroke-width: 0.5; }
        .volger { fill: #dddbd9; stroke: #34404d; stroke-width: 0.6; }
        .leider { fill: #34404d; stroke: #34404d; stroke-width: 0.6; }
        .nr { font-size: 3.2px; font-weight: 800; fill: #34404d; }
        .nr-licht { font-size: 3.2px; font-weight: 800; fill: #f4f0ec; }
        .pass { fill: none; stroke: #34404d; stroke-width: 0.5; stroke-dasharray: 1.2 0.8; }
        .loop { fill: none; stroke: #34404d; stroke-width: 0.6; }
        .notitie { font-size: 3px; font-weight: 400; font-style: italic; fill: #34404d; }
        .kop { font-size: 3.6px; font-weight: 800; letter-spacing: 0.2px; fill: #34404d; text-anchor: start; }
        .sub { font-size: 2.9px; font-weight: 400; font-style: italic; fill: #34404d; text-anchor: start; }
        .coach-kop { font-size: 3.6px; font-weight: 800; letter-spacing: 0.2px; fill: #f4f0ec; }
        .coach-sub { font-size: 2.8px; font-weight: 400; font-style: italic; fill: #f4f0ec; }
    </style>
    <defs>
        <marker id="pijl" viewBox="0 0 4 4" refX="3" refY="2" markerWidth="4" markerHeight="4" orient="auto">
            <path d="M0,0 L4,2 L0,4 z" fill="#34404d" />
        </marker>
    </defs>

    <!-- veld: de situatie -->
    <rect x="2" y="2" width="116" height="62" rx="2" fill="#f4f0ec" stroke="#34404d" stroke-width="0.8" />
    <line x1="60" y1="2" x2="60" y2="64" class="lijn" />
    <circle cx="60" cy="33" r="8" class="lijn" />
    <rect x="2" y="18" width="13" height="30" class="lijn" />
    <rect x="105" y="18" width="13" height="30" class="lijn" />

    <!-- looplijnen: back stoomt op, nr. 6 neemt zijn plek over -->
    <path d="M22,13 Q30,6 40.5,8" class="loop" marker-end="url(#pijl)" />
    <path d="M48,30 Q38,27 29,20.5" class="loop" stroke-dasharray="1.2 0.8" marker-end="url(#pijl)" />

    <!-- passdriehoek: de leiding gaat rond -->
    <polygon points="46,9 62,25 86,15" class="pass" />

    <!-- spelers (4-3-3): volgers -->
    <circle cx="8" cy="33" r="3.4" class="volger" /><text x="8" y="34.2" class="nr">1</text>
    <circle cx="22" cy="13" r="3.4" fill="none" stroke="#8c99a8" stroke-width="0.5" stroke-dasharray="0.8 0.6" />
    <circle cx="22" cy="27" r="3.4" class="volger" /><text x="22" y="28.2" class="nr">4</text>
    <circle cx="22" cy="41" r="3.4" class="volger" /><text x="22" y="42.2" class="nr">3</text>
    <circle cx="22" cy="55" r="3.4" class="volger" /><text x="22" y="56.2" class="nr">5</text>
    <circle cx="27" cy="19" r="3.4" class="volger" /><text x="27" y="20.2" class="nr">6</text>
    <circle cx="62" cy="25" r="3.4" class="volger" /><text x="62" y="26.2" class="nr">8</text>
    <circle cx="50" cy="46" r="3.4" class="volger" /><text x="50" y="47.2" class="nr">10</text>
    <circle cx="86" cy="15" r="3.4" class="volger" /><text x="86" y="16.2" class="nr">7</text>
    <circle cx="95" cy="33" r="3.4" class="volger" /><text x="95" y="34.2" class="nr">9</text>
    <circle cx="86" cy="51" r="3.4" class="volger" /><text x="86" y="52.2" class="nr">11</text>

    <!-- balbezitter: tijdelijk leider -->
    <circle cx="46" cy="9" r="5.4" fill="none" stroke="#34404d" stroke-width="0.4" />
    <circle cx="46" cy="9" r="4" class="leider" />
    <text x="46" y="10.2" class="nr-licht">2</text>
    <circle cx="50.8" cy="12.6" r="1.2" fill="#f4f0ec" stroke="#34404d" stroke-width="0.4" />

    <!-- notities -->
    <text x="52.5" y="6.5" class="notitie" style="text-anchor: start;">neemt initiatief</text>
    <text x="38" y="35.5" class="notitie">neemt plek over</text>
    <text x="76" y="24.5" class="notitie">samenspel</text>

    <!-- legenda: leiders, volgers en situatie -->
    <circle cx="6" cy="70.6" r="2.2" class="leider" />
    <text x="10" y="71.8" class="kop">LEIDER</text>
    <text x="10" y="75.6" class="sub">wisselt per moment</text>

    <circle cx="45" cy="70.6" r="2.2" class="volger" />
    <text x="49" y="71.8" class="kop">VOLGERS</text>
    <text x="49" y="75.6" class="sub">maken leiden mogelijk</text>

    <rect x="82" y="68.4" width="5" height="4.4" rx="0.6" fill="#f4f0ec" stroke="#34404d" stroke-width="0.6" />
    <text x="89.5" y="71.8" class="kop">SITUATIE</text>
    <text x="89.5" y="75.6" class="sub">veld, regels, formatie</text>

    <!-- coach langs de lijn -->
    <rect x="22" y="79" width="76" height="11" rx="5.5" fill="#34404d" />
    <text x="60" y="83.6" class="coach-kop">COACH LANGS DE LIJN</text>
    <text x="60" y="87.6" class="coach-sub">trapt zelf geen bal, schept ruimte en veiligheid</text>
</svg>
