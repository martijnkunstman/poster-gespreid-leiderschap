<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 95">
    <style>
        text { font-family: "Google Sans", Arial, sans-serif; }
        .illeris-hoek { font-size: 6px; font-weight: 800; letter-spacing: 0.2px; fill: #34404d; }
        .illeris-gl { font-size: 5.2px; font-weight: 800; letter-spacing: 0.2px; fill: #f4f0ec; }
    </style>
    <!-- driehoek -->
    <polygon points="8,13 92,13 50,82" fill="#f4f0ec" stroke="#34404d" stroke-width="0.8" />
    <!-- hoeken -->
    <text x="2" y="8" class="illeris-hoek" text-anchor="start">INHOUD</text>
    <text x="98" y="8" class="illeris-hoek" text-anchor="end">DRIJFVEER</text>
    <text x="50" y="91" class="illeris-hoek" text-anchor="middle">INTERACTIE</text>
    <!-- plaats van gespreid leiderschap: onder het midden, richting interactie -->
    <rect x="24" y="43" width="52" height="16" rx="5" fill="#34404d" />
    <text x="50" y="50" class="illeris-gl" text-anchor="middle">GESPREID</text>
    <text x="50" y="56" class="illeris-gl" text-anchor="middle">LEIDERSCHAP</text>
</svg>
